name: CI

on:
  push:
    branches:
      - danielRios_p2_base
      - danielRios_p2_dev

  workflow_dispatch:

jobs:
  ## 🔧 1. 
  static-codecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Static Code Analysis
        run: flake8 .

      - name: Run Unit Tests
        run: pytest tests/unit

  ## 🔧 2. 
  build:
    needs: static-codecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set tag
        id: vars
        run: echo "TAG=${GITHUB_REF##*/}-1.0.0+${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/restapp:$TAG .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/restapp:$TAG

  ## 🚀 3. 
  deploy-dev:
    environment:
      name: Develop
    needs: build
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/danielRios_p2_dev'
    steps:
      - name: Cleanup old containers
        run: |
          docker rm -f redisService || true
          docker rm -f restapp || true

      - name: Deploy Redis
        run: docker run -d --name redisService redis:alpine

      - name: Get Redis IP
        id: redisip
        run: echo "REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redisService)" >> $GITHUB_ENV

      - name: Deploy REST App
        run: docker run -d --name restapp --add-host redis:$REDIS_IP -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.TAG }}

      - name: Run Integration Tests
        run: pytest tests/integration


  ## 🚀 4. 
  deploy-prod:
    environment:
      name: Production
    needs: build
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/danielRios_p2_base'
    steps:
      - name: Cleanup old containers
        run: |
          docker rm -f redisService || true
          docker rm -f restapp || true

      - name: Deploy Redis
        run: docker run -d --name redisService redis:alpine

      - name: Get Redis IP
        id: redisip
        run: echo "REDIS_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redisService)" >> $GITHUB_ENV

      - name: Deploy REST App
        run: docker run -d --name restapp --add-host redis:$REDIS_IP -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/restapp:${{ env.TAG }}

      - name: Run Integration Tests
        run: pytest tests/integration